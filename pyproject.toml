[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ai-knowledge-assistant"
version = "0.1.0"
description = "Transparent Retrieval-Augmented Generation system"
authors = [{ name = "pk" }]
requires-python = ">=3.9"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042", "UP045", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
